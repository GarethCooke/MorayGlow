<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorayGlow — Devices</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .device-list { width: 100%; display: flex; flex-direction: column; gap: 0.4rem; }
        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            text-decoration: none;
            color: var(--text);
            transition: border-color 0.2s;
        }
        .device-item:hover { border-color: var(--on-color); }
        .device-id   { font-size: 0.9rem; }
        .device-ip   { font-size: 0.75rem; color: var(--muted); }
        .device-arrow { color: var(--muted); font-size: 1.1rem; }
        .back-link {
            font-size: 0.8rem;
            color: var(--muted);
            text-decoration: none;
        }
        .back-link:hover { color: var(--text); }
    </style>
    <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body>
    <button type="button" class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>

    <div class="container">
        <h1>MorayGlow</h1>
        <p class="status">Devices on this network</p>

        <div class="card">
            <div id="device-list" class="device-list">
                <p class="status">Scanning&hellip;</p>
            </div>
        </div>

        <a href="/" class="back-link">&#8592; Back to controls</a>
    </div>

    <script>
    var SUN = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
    var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    function toggleTheme() {
      var light = document.documentElement.classList.toggle('light');
      localStorage.setItem('theme', light ? 'light' : 'dark');
      document.getElementById('theme-icon').innerHTML = light ? MOON : SUN;
    }
    document.getElementById('theme-icon').innerHTML = document.documentElement.classList.contains('light') ? MOON : SUN;

    (function () {
        'use strict';

        var listEl = document.getElementById('device-list');

        fetch('/api/devices')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var devices = data.devices || [];
                if (devices.length === 0) {
                    listEl.innerHTML = '<p class="status">No devices found</p>';
                    return;
                }
                listEl.innerHTML = '';
                devices.forEach(function (d, idx) {
                    var a = document.createElement('a');
                    a.className = 'device-item';
                    a.href = d.url;
                    a.innerHTML =
                        '<div>'
                        + '<div class="device-id">' + d.id + (idx === 0 ? ' <span style="color:var(--on-color);font-size:0.7rem;">(this device)</span>' : '') + '</div>'
                        + '<div class="device-ip">' + d.ip + '</div>'
                        + '</div>'
                        + '<span class="device-arrow">&#8250;</span>';
                    listEl.appendChild(a);
                });
            })
            .catch(function () {
                listEl.innerHTML = '<p class="status">Scan failed &mdash; try refreshing</p>';
            });
    }());
    </script>
</body>
</html>
